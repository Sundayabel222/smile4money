name: Validate Environments

on:
  push:
    branches: [master]
    paths:
      - environments.toml
      - scripts/validate_environments.py
      - scripts/test_validate_environments.py
  pull_request:
    paths:
      - environments.toml
      - scripts/validate_environments.py
      - scripts/test_validate_environments.py

jobs:
  validate-environments:
    name: Validate environments.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.12"

      - name: Validate environments.toml
        run: python scripts/validate_environments.py

      - name: Run validation tests
        run: python scripts/test_validate_environments.py
